<aside class="sidebar">

  <!-- Header / Brand -->
  <div class="sidebar-header">
    <div class="brand-logo">
      <span class="logo-icon">🎓</span>
      <h2>GestARTE</h2>
    </div>
  </div>

  <!-- Menú de Navegación -->
  <nav class="sidebar-menu">
    <a [routerLink]="obtenerRutaDashboard()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="icon">🏠</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/dashboard/projects" routerLinkActive="active">
      <span class="icon">📁</span>
      <span>Proyectos</span>
    </a>

    <a routerLink="/dashboard/requests" routerLinkActive="active">
      <span class="icon">🤝</span>
      <span>Solicitudes</span>
    </a>

    @if (auth.esTutor()) {
      <a routerLink="/dashboard/tutor-requests" routerLinkActive="active">
        <span class="icon">👨‍🏫</span>
        <span>Solicitudes Tutor</span>
      </a>
    }

    @if (auth.esCoordinador()) {
      <a routerLink="/dashboard/users" routerLinkActive="active">
        <span class="icon">👥</span>
        <span>Usuarios</span>
      </a>
    }

    <a routerLink="/dashboard/community" routerLinkActive="active">
      <span class="icon">🌐</span>
      <span>Comunidad</span>
    </a>

    <a routerLink="/dashboard/tools" routerLinkActive="active">
      <span class="icon">🛠️</span>
      <span>Herramientas</span>
    </a>
  </nav>

  <!-- Área de Usuario / Configuración -->
  <div class="sidebar-user">
    @if (mostrarMenuUsuario) {
      <div class="dropdown-backdrop" (click)="mostrarMenuUsuario = false"></div>
    }

    <button 
      type="button"
      class="user-menu-btn" 
      [class.active]="mostrarMenuUsuario"
      (click)="mostrarMenuUsuario = !mostrarMenuUsuario">
      <div class="user-avatar">⚙️</div>
      <span class="user-label">Opciones</span>
      <span class="chevron" [class.open]="mostrarMenuUsuario">▾</span>
    </button>

    @if (mostrarMenuUsuario) {
      <div class="user-dropdown">
        <button type="button" (click)="irAMiPerfil(); mostrarMenuUsuario = false">
          <span class="icon">👤</span> Mi perfil
        </button>

        <button type="button" routerLink="/dashboard/profile" (click)="mostrarMenuUsuario = false">
          <span class="icon">⚙️</span> Configuración
        </button>

        <div class="dropdown-divider"></div>

        <button type="button" class="logout-btn" (click)="logout(); mostrarMenuUsuario = false">
          <span class="icon">🚪</span> Cerrar sesión
        </button>
      </div>
    }
  </div>

</aside>

<div class="sidebar">

    <div class="sidebar-header">

        <h2>🎓 Plataforma Artes</h2>

    </div>

    <nav class="sidebar-menu">

        <a [routerLink]="obtenerRutaDashboard()" routerLinkActive="active">

            🏠 Dashboard

        </a>

        <a routerLink="/dashboard/projects" routerLinkActive="active">

            📁 Proyectos

        </a>

        <a routerLink="/dashboard/requests" routerLinkActive="active">

            🤝 Solicitudes

        </a>

        @if(auth.esTutor()){

        <a routerLink="/dashboard/tutor-requests" routerLinkActive="active">

            👨‍🏫 Solicitudes de Tutor

        </a>

        }

        @if(auth.esCoordinador()){

        <a routerLink="/dashboard/users" routerLinkActive="active">

            👥 Usuarios

        </a>

        }

        <a routerLink="/dashboard/community" routerLinkActive="active">

            🌐 Comunidad

        </a>


        <a routerLink="/dashboard/profile" routerLinkActive="active">

 🔧 Herramientas 

        </a>

    </nav>

    <div class="sidebar-user">

  <button
    class="user-menu-btn"
    (click)="mostrarMenuUsuario = !mostrarMenuUsuario">

    <span>⚙️</span>


  </button>

  <div
    class="user-dropdown"
    *ngIf="mostrarMenuUsuario">

   <button
  type="button"
  (click)="irAMiPerfil()">

  👤 Mi perfil

</button>

    <button
      routerLink="/dashboard/profile">

      Configuración

    </button>

    <button
      (click)="logout()">

      Cerrar sesión

    </button>

  </div>

</div>

</div>

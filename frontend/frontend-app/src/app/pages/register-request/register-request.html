<div class="register-container">
  
  <div class="register-card">
    <!-- Encabezado -->
    <div class="card-header">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" y1="8" x2="19" y2="14"></line>
          <line x1="16" y1="11" x2="22" y2="11"></line>
        </svg>
      </div>
      <h2>Solicitud de Registro</h2>
      <p>Ingresa tus datos para solicitar acceso a la plataforma como estudiante.</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="enviarSolicitud()" #registerForm="ngForm">
      
      <div class="form-group">
        <label for="fullName">Nombre Completo *</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          [(ngModel)]="form.fullName" 
          placeholder="Ej. Juan Carlos Pérez" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico *</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="form.email" 
          placeholder="ejemplo@institucion.edu.co" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="department">Programa Académico *</label>
        <select 
          id="department" 
          name="department" 
          [(ngModel)]="form.department" 
          required>
          <option value="" disabled selected>Selecciona tu programa...</option>
          <option *ngFor="let programa of programasDisponibles" [value]="programa">
            {{ programa }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="reason">Motivo de la solicitud *</label>
        <textarea 
          id="reason" 
          name="reason" 
          rows="3" 
          [(ngModel)]="form.reason" 
          placeholder="Indica brevemente la razón por la cual requieres acceso..." 
          required>
        </textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="loading || !registerForm.valid">
          <span *ngIf="!loading">Enviar Solicitud</span>
          <span *ngIf="loading">Enviando...</span>
        </button>

        <button type="button" class="btn-secondary" (click)="volverAlLogin()">
          Cancelar
        </button>
      </div>

    </form>
  </div>

  <!-- Ventana emergente (Modal de éxito) -->
  <div class="modal-backdrop" *ngIf="mostrarModalExito">
    <div class="modal-card">
      <div class="animated-icon">
        <div class="circle"></div>
        <div class="checkmark">✓</div>
      </div>
      
      <h3>¡Solicitud Enviada!</h3>
      <p>Tu solicitud ha sido enviada al área de coordinación. Recibirás respuesta en tu correo electrónico.</p>
      
      <div class="redirect-notice">
        <span>Redirigiendo al inicio de sesión...</span>
      </div>

      <button type="button" class="btn-primary" (click)="volverAlLogin()">
        Volver al Login Ahora
      </button>
    </div>
  </div>

</div>

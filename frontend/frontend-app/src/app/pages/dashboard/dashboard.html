<div class="dashboard-container">

    <app-sidebar></app-sidebar>

    <div class="dashboard-content">

        <app-topbar></app-topbar>

        <main class="page-content">
            <!-- Opción A: Banner de advertencia (Faltan 2 o 3 días) -->
            <app-warning-banner 
                *ngIf="showBanner" 
                [projects]="bannerProjects"
                (close)="showBanner = false">
            </app-warning-banner>

            <router-outlet></router-outlet>
        </main>

    </div>

</div>

<!-- Opción C: Modal Crítico Emergente (Falta 1 día o vence HOY) -->
<app-critical-modal 
    *ngIf="showModal" 
    [projects]="criticalProjects"
    (close)="cerrarModal()">
</app-critical-modal>

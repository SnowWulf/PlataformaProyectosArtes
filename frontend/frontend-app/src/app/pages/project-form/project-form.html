<!-- Sprite local de iconos -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-text-left" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h10M4 18h14" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-align-left" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h12M3 18h15" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-category" viewBox="0 0 24 24">
      <path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/>
    </symbol>
    <symbol id="i-save" viewBox="0 0 24 24">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </symbol>
  </defs>
</svg>

<div class="project-form-container">
  <p class="form-subtitle">
    Completa la información del proyecto para registrarlo en el Sistema de Gestión Cultural.
  </p>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="project-form" novalidate>
    
    <!-- Campo: Título -->
    <div class="form-group">
      <label for="titulo">Título del proyecto</label>
      <div class="input-shell">
        <svg class="icon icon-sm field-icon" aria-hidden="true">
          <use href="#i-text-left" />
        </svg>
        <input
          id="titulo"
          type="text"
          formControlName="titulo"
          placeholder="Ej. Estudio analítico sobre el grabado tradicional nariñense"
        />
      </div>
    </div>

    <!-- Campo: Descripción -->
    <div class="form-group">
      <label for="descripcion">Descripción del proyecto</label>
      <div class="input-shell textarea-shell">
        <svg class="icon icon-sm field-icon" aria-hidden="true">
          <use href="#i-align-left" />
        </svg>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          rows="5"
          placeholder="Describe la justificación, alcance y objetivos del proyecto..."
        ></textarea>
      </div>
    </div>

    <!-- Campo: Tipo de Proyecto -->
    <div class="form-group">
      <label for="tipo_proyecto">Tipo de proyecto</label>
      <div class="input-shell select-shell">
        <svg class="icon icon-sm field-icon" aria-hidden="true">
          <use href="#i-category" />
        </svg>
        <select id="tipo_proyecto" formControlName="tipo_proyecto">
          <option value="" disabled selected>Seleccione un tipo de proyecto</option>
          <option value="Investigación">Investigación</option>
          <option value="Investigación-Creación">Investigación-Creación</option>
          <option value="Creación Artística">Creación Artística</option>
          <option value="Pasantía">Pasantía</option>
          <option value="Extensión / Interacción Social">Extensión / Interacción Social</option>
          <option value="Gestión Cultural">Gestión Cultural</option>
          <option value="Innovación y Desarrollo">Innovación y Desarrollo</option>
          <option value="Formación Artística y Pedagógica">Formación Artística y Pedagógica</option>
          <option value="Emprendimiento e Industrias Creativas">Emprendimiento e Industrias Creativas</option>
          <option value="Patrimonio y Memoria Cultural">Patrimonio y Memoria Cultural</option>
        </select>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="form-actions">
      <button type="submit" class="btn-guardar" [disabled]="form.invalid">
        <svg class="icon icon-sm" aria-hidden="true">
          <use href="#i-save" />
        </svg>
        <span>Guardar proyecto</span>
      </button>
    </div>

  </form>
</div>

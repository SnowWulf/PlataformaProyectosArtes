<div class="request-card">

  <div class="request-header">

    <h2>

      👩‍🏫 Solicitar tutor

    </h2>

    <p>

      Selecciona el tutor que deseas para tu proyecto y envíale una solicitud.

    </p>

  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="enviarSolicitud()">

    <div class="form-group">

      <label>

        Tutor

      </label>

      <select formControlName="tutor_id">

        <option value="">

          Seleccione un tutor

        </option>

        <option
          *ngFor="let tutor of tutores"
          [value]="tutor.id">

          {{ tutor.name }}

        </option>

      </select>

    </div>

    <div class="form-group">

      <label>

        Mensaje (opcional)

      </label>

      <textarea
        rows="5"
        formControlName="mensaje"
        placeholder="Explique brevemente por qué desea trabajar con este tutor...">

      </textarea>

    </div>

    <div class="actions">

      <button
        type="submit"
        class="btn-primary">

        📨 Enviar solicitud

      </button>

    </div>

  </form>

</div>

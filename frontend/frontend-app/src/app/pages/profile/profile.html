<div class="perfil-container">

  <!-- Encabezado -->
  <div class="page-header">
    <h2>⚙️ Configuración de Perfil</h2>
    <p>Actualiza tu información personal y ajusta tus preferencias de privacidad.</p>
  </div>

  <div class="profile-card">
    <!-- Sección de Foto de Perfil -->
    <div class="foto-section">
      <div class="avatar-wrapper">
        <img
          [src]="usuario.foto_url || '/user.webp'"
          [alt]="'Foto de perfil de ' + usuario.name"
          class="profile-photo"
        />
        <label class="btn-change-photo" title="Cambiar foto de perfil">
          <span class="icon">📷</span>
          <input
            type="file"
            accept="image/*"
            (change)="seleccionarFoto($event)"
          />
        </label>
      </div>

      <!-- Información Básica -->
      <div class="datos-section">
        <h3>{{ usuario.name }}</h3>
        @if (usuario.programa) {
          <p class="program-badge">🎓 {{ usuario.programa }}</p>
        }
      </div>
    </div>

    <hr class="divider" />

    <!-- Campo de Biografía -->
    <div class="form-group">
      <label for="bio">Biografía</label>
      <textarea
        id="bio"
        [(ngModel)]="usuario.bio"
        rows="4"
        placeholder="Cuéntanos sobre ti, tus intereses artísticos o áreas de enfoque..."
      ></textarea>
    </div>

    <!-- Opciones de Privacidad -->
    <div class="privacidad-section">
      <h4>Privacidad y Visibilidad</h4>
      
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="usuario.mostrar_proyectos"
          />
          <span class="checkbox-text">
            <strong>Mostrar mis proyectos públicamente</strong>
            <small>Permite que otros usuarios exploren tu trabajo en la comunidad.</small>
          </span>
        </label>

        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="usuario.mostrar_correo"
          />
          <span class="checkbox-text">
            <strong>Mostrar mi correo públicamente</strong>
            <small>Permite que otros miembros puedan contactarte por email.</small>
          </span>
        </label>
      </div>
    </div>

    <!-- Botón de Acción -->
    <div class="form-actions">
      <button class="btn-primary" (click)="guardarPerfil()">
        💾 Guardar cambios
      </button>
    </div>
  </div>

</div>

<div class="change-password-container">
  <div class="card">
    <h2>Cambio de Contraseña Obligatorio</h2>
    <p class="description">
      Has ingresado con una contraseña temporal. Por razones de seguridad, debes actualizar tu contraseña antes de continuar.
    </p>

    <form (ngSubmit)="cambiarPassword()">
      <div class="form-group">
        <label for="currentPassword">Contraseña Temporal / Actual</label>
        <input
          type="password"
          id="currentPassword"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          required
        />
      </div>

      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <input
          type="password"
          id="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
        />
      </div>

      <div class="form-group">
        <label for="newPasswordConfirmation">Confirmar Nueva Contraseña</label>
        <input
          type="password"
          id="newPasswordConfirmation"
          [(ngModel)]="newPasswordConfirmation"
          name="newPasswordConfirmation"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="cargando" class="btn-submit">
        {{ cargando ? 'Guardando...' : 'Actualizar Contraseña' }}
      </button>
    </form>
  </div>
</div>

<!-- Sprite de iconos (Vectoriales / Estilo Feather) -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-upload-cloud" viewBox="0 0 24 24">
    <polyline points="16 16 12 12 8 16"></polyline>
    <line x1="12" y1="12" x2="12" y2="21"></line>
    <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
    <polyline points="16 16 12 12 8 16"></polyline>
  </symbol>
  <symbol id="i-file-text" viewBox="0 0 24 24">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <line x1="16" y1="13" x2="8" y2="13"></line>
    <line x1="16" y1="17" x2="8" y2="17"></line>
  </symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24">
    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
  </symbol>
  <symbol id="i-message-square" viewBox="0 0 24 24">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24">
    <line x1="22" y1="2" x2="11" y2="13"></line>
    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
    <polyline points="22 4 12 14.01 9 11.01"></polyline>
  </symbol>
</svg>

<div class="modal-backdrop" (click)="cancelar.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <!-- ENCABEZADO DEL MODAL -->
    <header class="modal-header">
      <span class="header-icon" aria-hidden="true">
        <svg class="icon"><use href="#i-upload-cloud"></use></svg>
      </span>
      <div class="header-copy">
        <span class="header-eyebrow">Universidad de Nariño</span>
        <h2>Responder entrega</h2>
        <small>Envío de compromisos y tareas académicas</small>
      </div>
      <button type="button" class="btn-close" (click)="cancelar.emit()" aria-label="Cerrar modal">
        <svg class="icon icon-xs"><use href="#i-close"></use></svg>
      </button>
    </header>

    <!-- CUERPO DEL FORMULARIO -->
    <div class="modal-body">
      
      <!-- Título de la entrega (Lectura) -->
      <div class="field-group">
        <div class="field-head">
          <label>
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file-text"></use></svg>
            Entrega a responder
          </label>
          <span class="field-tag field-tag--read">Lectura</span>
        </div>
        <input 
          type="text" 
          [value]="entrega?.titulo" 
          readonly 
          class="input-readonly">
      </div>

      <!-- Descripción de la entrega (Lectura) -->
      @if (entrega?.descripcion) {
      <div class="field-group">
        <div class="field-head">
          <label>Instrucciones</label>
        </div>
        <textarea 
          rows="3" 
          readonly 
          class="input-readonly">{{ entrega.descripcion }}</textarea>
      </div>
      }

      <!-- Subir Archivo -->
      <div class="field-group">
        <div class="field-head">
          <label for="fileInput">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-paperclip"></use></svg>
            Archivo adjunto
          </label>
          <span class="field-tag field-tag--req">Requerido</span>
        </div>
        
        <div class="file-dropzone">
          <input 
            type="file" 
            id="fileInput"
            (change)="seleccionarArchivo($event)"
            class="file-input-hidden">
            
          <label for="fileInput" class="dropzone-trigger">
            <span class="dropzone-icon">
              <svg class="icon"><use href="#i-upload-cloud"></use></svg>
            </span>
            <div class="dropzone-text">
              <strong>Seleccionar o arrastrar archivo</strong>
              <small>PDF, DOCX, ZIP o imágenes hasta 25MB</small>
            </div>
          </label>
        </div>
      </div>

      <!-- Comentario (Editable) -->
      <div class="field-group">
        <div class="field-head">
          <label for="comentario-submission">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-message-square"></use></svg>
            Comentario u observaciones
          </label>
          <span class="field-tag field-tag--opt">Opcional</span>
        </div>
        <textarea 
          id="comentario-submission"
          rows="3" 
          [(ngModel)]="comentario" 
          placeholder="Escribe un mensaje explicativo sobre tu entrega..."></textarea>
      </div>

    </div>

    <!-- ACCIONES DEL MODAL -->
    <footer class="modal-footer">
      <button type="button" class="btn-ghost" (click)="cancelar.emit()">
        <svg class="icon icon-xs" aria-hidden="true"><use href="#i-close"></use></svg>
        Cancelar
      </button>
      <button type="button" class="btn-primary" (click)="enviar()">
        <svg class="icon icon-xs" aria-hidden="true"><use href="#i-send"></use></svg>
        Enviar respuesta
      </button>
    </footer>

  </div>
</div>

<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-md border border-gray-100 mt-6">
  <h2 class="text-xl font-bold text-gray-800 mb-2">Preferencias de Notificaciones</h2>
  <p class="text-sm text-gray-500 mb-6">Elige qué avisos deseas recibir en la aplicación y por correo electrónico.</p>

  <div *ngIf="loading" class="py-8 text-center text-gray-500 text-sm">Cargando opciones...</div>

  <div *ngIf="!loading">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b border-gray-200">
          <th class="py-3 text-sm font-semibold text-gray-700">Tipo de Evento</th>
          <th class="py-3 text-center text-sm font-semibold text-gray-700">En la App</th>
          <th class="py-3 text-center text-sm font-semibold text-gray-700">Correo</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let item of preferences" class="hover:bg-gray-50">
          <td class="py-4 text-sm text-gray-800 font-medium">
            {{ labelsMap[item.tipo_clave] || item.tipo_clave }}
          </td>
          <td class="py-4 text-center">
            <input type="checkbox" [(ngModel)]="item.canal_inapp" 
                   class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
          </td>
          <td class="py-4 text-center">
            <input type="checkbox" [(ngModel)]="item.canal_email" 
                   class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="successMessage" class="mt-4 p-3 bg-green-100 text-green-700 rounded-md text-sm">
      {{ successMessage }}
    </div>

    <div class="mt-6 text-right">
      <button (click)="save()" [disabled]="saving" 
              class="px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 disabled:opacity-50 text-sm transition-colors">
        {{ saving ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>
  </div>
</div>

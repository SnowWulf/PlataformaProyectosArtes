<!-- Sprite de iconos (Vectoriales / Estilo Feather) -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-user-x" viewBox="0 0 24 24">
    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
    <circle cx="8.5" cy="7" r="4"></circle>
    <line x1="18" y1="8" x2="23" y2="13"></line>
    <line x1="23" y1="8" x2="18" y2="13"></line>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24">
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
    <line x1="12" y1="9" x2="12" y2="13"></line>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
  </symbol>
</svg>

<!-- CONTENEDOR MODAL / TELÓN DE FONDO -->
<div class="modal-backdrop" (click)="cancelar.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">

    <!-- CABECERA DEL DIÁLOGO -->
    <header class="dialog-header">
      <span class="header-icon" aria-hidden="true">
        <svg class="icon"><use href="#i-user-x"></use></svg>
      </span>
      <div class="header-copy">
        <span class="header-eyebrow">Universidad de Nariño</span>
        <h2>Eliminar usuario</h2>
        <small>Acción administrativa irreversible</small>
      </div>
    </header>

    <!-- CUERPO DEL DIÁLOGO -->
    <div class="dialog-body">

      <!-- Tarjeta informativa del usuario -->
      <div class="user-card">
        <span class="user-label">Usuario a eliminar:</span>
        <strong class="user-name">{{ usuario?.name }}</strong>
      </div>

      <div class="warning-banner">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-alert"></use></svg>
        <span>Esta acción es permanente y no podrá deshacerse.</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="eliminar()" class="dialog-form">
        <div class="field-group">
          <div class="field-head">
            <label for="confirm-password">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-lock"></use></svg>
              Ingrese su contraseña
            </label>
            <span class="field-tag field-tag--req">Requerido</span>
          </div>

          <input
            id="confirm-password"
            type="password"
            formControlName="password"
            placeholder="••••••••">

          <small
            *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
            class="error-message">
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-alert"></use></svg>
            Debe ingresar su contraseña para confirmar.
          </small>
        </div>

        <!-- ACCIONES -->
        <div class="dialog-actions">
          <button
            type="button"
            class="btn-ghost"
            (click)="cancelar.emit()">
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-close"></use></svg>
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-danger"
            [disabled]="form.invalid">
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-trash"></use></svg>
            Eliminar
          </button>
        </div>
      </form>

    </div>

  </div>
</div>

<!-- Sprite de iconos (Vectoriales / Estilo Feather) -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-calendar-plus" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>
    <line x1="8" y1="2" x2="8" y2="6"></line>
    <line x1="3" y1="10" x2="21" y2="10"></line>
    <line x1="12" y1="14" x2="12" y2="18"></line>
    <line x1="10" y1="16" x2="14" y2="16"></line>
  </symbol>
  <symbol id="i-edit-3" viewBox="0 0 24 24">
    <path d="M12 20h9"></path>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
  </symbol>
  <symbol id="i-file-text" viewBox="0 0 24 24">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <line x1="16" y1="13" x2="8" y2="13"></line>
    <line x1="16" y1="17" x2="8" y2="17"></line>
    <polyline points="10 9 9 9 8 9"></polyline>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"></circle>
    <polyline points="12 6 12 12 16 14"></polyline>
  </symbol>
  <symbol id="i-alert-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12"></polyline>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </symbol>
</svg>

@if (visible) {
<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">

    <!-- CABECERA -->
    <header class="modal-header">
      <span class="header-icon" aria-hidden="true">
        <svg class="icon">
          <use [attr.href]="delivery ? '#i-edit-3' : '#i-calendar-plus'"></use>
        </svg>
      </span>
      <div class="header-copy">
        <span class="header-eyebrow">Universidad de Nariño</span>
        <h2>
          @if (delivery) { Editar entrega } @else { Nueva entrega }
        </h2>
        <small>Asignación de tareas y compromisos académicos</small>
      </div>
    </header>

    <!-- CUERPO / FORMULARIO -->
    <div class="modal-body">
      <form (ngSubmit)="guardar()" class="modal-form">
        
        <!-- Campo: Título -->
        <div class="field-group">
          <div class="field-head">
            <label for="delivery-titulo">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file-text"></use></svg>
              Título de la entrega
            </label>
            <span class="field-tag field-tag--req">Requerido</span>
          </div>
          <input
            id="delivery-titulo"
            type="text"
            [(ngModel)]="form.titulo"
            name="titulo"
            placeholder="Ej. Primer Avance de Tesis"
            required>
        </div>

        <!-- Campo: Descripción -->
        <div class="field-group">
          <div class="field-head">
            <label for="delivery-descripcion">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file-text"></use></svg>
              Descripción e instrucciones
            </label>
          </div>
          <textarea
            id="delivery-descripcion"
            rows="4"
            [(ngModel)]="form.descripcion"
            name="descripcion"
            placeholder="Detalle los requisitos, formato de entrega y observaciones para el estudiante..."></textarea>
        </div>

        <!-- Campo: Fecha límite -->
        <div class="field-group">
          <div class="field-head">
            <label for="delivery-fecha">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-clock"></use></svg>
              Fecha y hora límite
            </label>
            <span class="field-tag field-tag--req">Requerido</span>
          </div>
          <input
            id="delivery-fecha"
            type="datetime-local"
            [(ngModel)]="form.fecha_limite"
            name="fecha_limite"
            required>
        </div>

        <!-- Campo: Checkbox Obligatorio -->
        <div class="checkbox-group">
          <label class="checkbox-label" for="delivery-obligatorio">
            <input
              id="delivery-obligatorio"
              type="checkbox"
              [(ngModel)]="form.obligatorio"
              name="obligatorio">
            <span class="checkbox-custom">
              <svg class="icon icon-xs"><use href="#i-check"></use></svg>
            </span>
            <span class="checkbox-text">
              <strong>Entrega obligatoria</strong>
              <small>Requerida para la habilitación de la siguiente fase</small>
            </span>
          </label>
        </div>

        <!-- ACCIONES -->
        <div class="modal-actions">
          <button
            type="button"
            class="btn-ghost"
            (click)="close.emit()">
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-close"></use></svg>
            Cancelar
          </button>

          <button
            type="submit"
            class="btn-primary">
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-check"></use></svg>
            Guardar
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
}

<!-- ============================================================
     EVENTO DE CALENDARIO (MODAL) — Universidad de Nariño
     Sistema visual compartido: login / document-review-form /
     request-tutor-form / upload-document-form / landing
     Compacto: cabecera y acciones fijas, cuerpo scrolleable.
     ============================================================ -->

<!-- Sprite de iconos -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.5" y="5.5" width="17" height="15" rx="2.5" />
      <path d="M3.5 10h17M8.5 3.5v4M15.5 3.5v4" />
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M4.5 19.5h4l10-10-4-4-10 10Z" />
      <path d="m14.5 5.5 4 4" />
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24">
      <path d="M4.5 10.5V4.5h6l9 9-6 6Z" />
      <circle cx="8" cy="8" r="1.2" />
    </symbol>
    <symbol id="i-comment" viewBox="0 0 24 24">
      <path d="M4.5 5.5h15v10h-9L6 19.5v-4H4.5Z" />
      <path d="M8 9.5h8M8 12.5h5" />
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7.5V12l3.5 2" />
    </symbol>
    <symbol id="i-flag" viewBox="0 0 24 24">
      <path d="M6 20.5V4.5h11l-2 4 2 4H6" />
    </symbol>
    <symbol id="i-layers" viewBox="0 0 24 24">
      <path d="m12 3.5 8 4.3-8 4.3-8-4.3Z" />
      <path d="m4 13 8 4.3 8-4.3" />
    </symbol>
    <symbol id="i-palette" viewBox="0 0 24 24">
      <path d="M12 3.5a8.5 8.5 0 0 0 0 17c1.4 0 2-.9 2-1.9 0-1.6 1.1-2.1 2.4-2.1h1.3c1.6 0 2.8-1.2 2.8-3 0-5-4.1-10-8.5-10Z" />
      <circle cx="8.6" cy="10.5" r="1.1" />
      <circle cx="12" cy="8" r="1.1" />
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M6.5 17.5v-5a5.5 5.5 0 0 1 11 0v5Z" />
      <path d="M4.8 17.5h14.4M10 20.2h4" />
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5 12.8 4.4 4.4L19 7.5" />
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18" />
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m7 10 5 5 5-5" />
    </symbol>
  </defs>
</svg>

<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="evento-titulo">
  <div class="modal">
    <!-- ---------- Cabecera ---------- -->
    <header class="modal-header">
      <span class="header-icon" aria-hidden="true">
        @if (modoEdicion) {
          <svg class="icon icon-sm"><use href="#i-edit" /></svg>
        } @else {
          <svg class="icon icon-sm"><use href="#i-calendar" /></svg>
        }
      </span>

      <span class="header-copy">
        <small class="header-eyebrow">Agenda institucional</small>
        <h2 id="evento-titulo">
          @if (modoEdicion) {
            Editar evento
          } @else {
            Nuevo evento
          }
        </h2>
      </span>

      <button type="button" class="header-close" (click)="cancelarModal()" aria-label="Cerrar">
        <svg class="icon icon-xs" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </header>

    <!-- ---------- Cuerpo ---------- -->
    <div class="modal-body">
      <div class="form-grid">
        <!-- Título -->
        <div class="form-group full-width">
          <div class="field-head">
            <label for="ev-titulo">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-tag" /></svg>
              <span>Título</span>
            </label>
            <span class="field-tag field-tag--req">Requerido</span>
          </div>
          <input
            id="ev-titulo"
            type="text"
            [(ngModel)]="evento.titulo"
            placeholder="Ej. Reunión de avance"
          >
        </div>

        <!-- Descripción -->
        <div class="form-group full-width">
          <div class="field-head">
            <label for="ev-desc">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-comment" /></svg>
              <span>Descripción</span>
            </label>
            <span class="field-tag">Opcional</span>
          </div>
          <textarea
            id="ev-desc"
            rows="2"
            [(ngModel)]="evento.descripcion"
            placeholder="Detalles del evento…"
          ></textarea>
        </div>

        <!-- Fecha inicio -->
        <div class="form-group">
          <div class="field-head">
            <label for="ev-inicio">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-play" /></svg>
              <span>Inicio</span>
            </label>
          </div>
          <input
            id="ev-inicio"
            type="datetime-local"
            [(ngModel)]="evento.fecha_inicio"
          >
        </div>

        <!-- Fecha fin -->
        <div class="form-group">
          <div class="field-head">
            <label for="ev-fin">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-flag" /></svg>
              <span>Fin</span>
            </label>
          </div>
          <input
            id="ev-fin"
            type="datetime-local"
            [(ngModel)]="evento.fecha_fin"
          >
        </div>

        <!-- Tipo -->
        <div class="form-group">
          <div class="field-head">
            <label for="ev-tipo">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-layers" /></svg>
              <span>Tipo</span>
            </label>
          </div>
          <div class="select-shell">
            <select id="ev-tipo" [(ngModel)]="evento.tipo">
              <option value="personal">Personal</option>
              <option value="academico">Académico</option>
              <option value="reunion">Reunión</option>
              <option value="otro">Otro</option>
            </select>
            <svg class="icon icon-sm select-arrow" aria-hidden="true"><use href="#i-chevron" /></svg>
          </div>
        </div>

        <!-- Color -->
        <div class="form-group">
          <div class="field-head">
            <label for="ev-color">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-palette" /></svg>
              <span>Color</span>
            </label>
          </div>
          <div class="color-shell">
            <input id="ev-color" type="color" [(ngModel)]="evento.color">
            <span class="color-value">{{ evento.color }}</span>
          </div>
        </div>

        <!-- Recordatorio -->
        <div class="form-group full-width">
          <label class="checkbox-group">
            <input type="checkbox" [(ngModel)]="evento.recordatorio">
            <span class="checkbox-box" aria-hidden="true">
              <svg class="icon icon-xs"><use href="#i-check" /></svg>
            </span>
            <span class="checkbox-copy">
              <svg class="icon icon-xs" aria-hidden="true"><use href="#i-bell" /></svg>
              <span>Activar recordatorio</span>
            </span>
          </label>
        </div>
      </div>
    </div>

    <!-- ---------- Acciones ---------- -->
    <div class="modal-buttons">
      <button type="button" class="btn-cancel" (click)="cancelarModal()">
        <svg class="icon icon-xs" aria-hidden="true"><use href="#i-x" /></svg>
        <span>Cancelar</span>
      </button>
      <button type="button" class="btn-save" (click)="guardarEvento()">
        <svg class="icon icon-xs" aria-hidden="true"><use href="#i-check" /></svg>
        <span>Guardar</span>
      </button>
    </div>
  </div>
</div>

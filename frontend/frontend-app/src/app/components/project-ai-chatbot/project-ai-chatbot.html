<!-- Botón flotante para abrir/cerrar el chatbot -->
<button 
  type="button" 
  class="chatbot-toggle-btn" 
  (click)="toggleChat()" 
  [class.active]="isOpen"
  [attr.aria-expanded]="isOpen"
  aria-label="Abrir Asistente IA de Proyecto"
  title="Asistente de IA">
  @if (!isOpen) {
    <span class="icon">🤖</span>
  } @else {
    <span class="icon">✕</span>
  }
</button>

<!-- Ventana Flotante del Chatbot -->
@if (isOpen) {
  <div class="chatbot-window" role="dialog" aria-labelledby="chatbot-title">
    <!-- Encabezado del Chat -->
    <div class="chatbot-header">
      <div class="bot-info">
        <span class="bot-avatar">🤖</span>
        <div>
          <h4 id="chatbot-title">Asistente IA</h4>
          <span class="status-online">En línea</span>
        </div>
      </div>
      <button type="button" class="close-btn" (click)="toggleChat()" aria-label="Cerrar chat">✕</button>
    </div>

    <!-- Cuerpo / Historial de Mensajes -->
    <div class="chatbot-messages" #scrollContainer id="chat-messages-container">
      
      <!-- Renderizado dinámico de mensajes desde el TS -->
      @for (msg of messages; track $index) {
        <div 
          class="message" 
          [class.user-message]="msg.sender === 'user'" 
          [class.bot-message]="msg.sender === 'ai' || msg.sender === 'bot'">
          
          <div class="message-content">
            <!-- Si el mensaje es de la IA, renderizamos con Markdown -->
            @if (msg.sender === 'ai' || msg.sender === 'bot') {
              <markdown [data]="msg.text"></markdown>
            } @else {
              <!-- Si el mensaje es del usuario, se muestra como texto plano -->
              {{ msg.text }}
            }
          </div>

          @if (msg.timestamp) {
            <span class="message-time">
              {{ msg.timestamp | date:'HH:mm' }}
            </span>
          }
        </div>
      }

      <!-- Indicador de "Escribiendo..." -->
      @if (isLoading) {
        <div class="message bot-message loading">
          <div class="message-content typing-box">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Pie / Formulario de Envío -->
    <form class="chatbot-footer" (ngSubmit)="sendMessage()">
      <input 
        type="text" 
        [(ngModel)]="newMessage" 
        name="newMessage" 
        placeholder="Escribe tu consulta sobre el proyecto..." 
        [disabled]="isLoading"
        autocomplete="off" />
      
      <button type="submit" [disabled]="!newMessage?.trim() || isLoading" aria-label="Enviar mensaje">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l-6-2-4.054-2.685z"/>
        </svg>
      </button>
    </form>
  </div>
}

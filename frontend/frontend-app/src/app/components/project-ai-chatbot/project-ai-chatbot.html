<!-- Sprite de iconos (Vectoriales / Estilo Feather) -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-bot" viewBox="0 0 24 24">
    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
    <circle cx="12" cy="5" r="2"></circle>
    <path d="M12 7v4"></path>
    <line x1="8" y1="16" x2="8" y2="16"></line>
    <line x1="16" y1="16" x2="16" y2="16"></line>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24">
    <line x1="22" y1="2" x2="11" y2="13"></line>
    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24">
    <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"></path>
  </symbol>
</svg>

<!-- Botón flotante para abrir/cerrar el chatbot -->
<button 
  type="button" 
  class="chatbot-toggle-btn" 
  (click)="toggleChat()" 
  [class.active]="isOpen"
  [attr.aria-expanded]="isOpen"
  aria-label="Abrir Asistente IA de Proyecto"
  title="Asistente de IA Institutional">
  @if (!isOpen) {
    <span class="icon" aria-hidden="true">
      <svg class="icon-svg"><use href="#i-bot"></use></svg>
    </span>
  } @else {
    <span class="icon" aria-hidden="true">
      <svg class="icon-svg"><use href="#i-close"></use></svg>
    </span>
  }
</button>

<!-- Ventana Flotante del Chatbot -->
@if (isOpen) {
  <div class="chatbot-window" role="dialog" aria-labelledby="chatbot-title">
    
    <!-- Encabezado del Chat -->
    <header class="chatbot-header">
      <div class="bot-info">
        <span class="bot-avatar" aria-hidden="true">
          <svg class="icon-svg"><use href="#i-sparkles"></use></svg>
        </span>
        <div class="bot-details">
          <span class="header-eyebrow">Institucional</span>
          <h4 id="chatbot-title">Asistente IA de Proyectos</h4>
          <span class="status-online">
            <span class="status-dot"></span>
            En línea
          </span>
        </div>
      </div>
      <button type="button" class="close-btn" (click)="toggleChat()" aria-label="Cerrar chat">
        <svg class="icon-svg icon-xs"><use href="#i-close"></use></svg>
      </button>
    </header>

    <!-- Cuerpo / Historial de Mensajes -->
    <div class="chatbot-messages" #scrollContainer id="chat-messages-container">
      
      <!-- Renderizado dinámico de mensajes -->
      @for (msg of messages; track $index) {
        <div 
          class="message" 
          [class.user-message]="msg.sender === 'user'" 
          [class.bot-message]="msg.sender === 'ai' || msg.sender === 'bot'">
          
          <div class="message-content">
            @if (msg.sender === 'ai' || msg.sender === 'bot') {
              <markdown [data]="msg.text"></markdown>
            } @else {
              {{ msg.text }}
            }
          </div>

          @if (msg.timestamp) {
            <span class="message-time">
              {{ msg.timestamp | date:'HH:mm' }}
            </span>
          }
        </div>
      }

      <!-- Indicador de "Escribiendo..." -->
      @if (isLoading) {
        <div class="message bot-message loading">
          <div class="message-content typing-box">
            <div class="typing-indicator" aria-label="El asistente está escribiendo">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Pie / Formulario de Envío -->
    <form class="chatbot-footer" (ngSubmit)="sendMessage()">
      <input 
        type="text" 
        [(ngModel)]="newMessage" 
        name="newMessage" 
        placeholder="Escribe tu consulta sobre el proyecto..." 
        [disabled]="isLoading"
        autocomplete="off" />
      
      <button type="submit" [disabled]="!newMessage?.trim() || isLoading" aria-label="Enviar mensaje">
        <svg class="icon-svg icon-xs" aria-hidden="true"><use href="#i-send"></use></svg>
      </button>
    </form>
  </div>
}

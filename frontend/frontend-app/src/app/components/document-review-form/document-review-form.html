<form [formGroup]="form">

<strong>Estado:</strong>

  <br>

  <select
    formControlName="estado">

    <option>
      Pendiente revisión
    </option>

    <option>
      En revisión
    </option>

    <option>
      Requiere correcciones
    </option>

    <option>
      Aprobado
    </option>

    <option>
      Rechazado
    </option>

  </select>

  <br><br>

<strong>Comentario:</strong>

  <br>

  <textarea
    formControlName="comentario">
  </textarea>

  <br><br>

<strong>Archivo Adjunto:</strong>

  <br>

  <input
    type="file"
    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
    (change)="onFileSelected($event)">

  <br><br>

  <button
    type="button"
    (click)="guardar()">

    Guardar revisión

  </button>

  <button
    type="button"
    (click)="cancelar()">

    Cancelar

  </button>

</form>
